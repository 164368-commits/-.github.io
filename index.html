<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎂 Happy Birthday 🎂</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Kanit",sans-serif;
}

body{
background:linear-gradient(135deg,#ff9ecf,#ffc4e1,#ffe3ef);
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* หน้าเริ่ม */

#startScreen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff69b4,#ffb6d9);
z-index:999;
}

#startBtn{
padding:20px 50px;
font-size:30px;
border:none;
border-radius:60px;
cursor:pointer;
background:white;
color:#ff1493;
font-weight:bold;
box-shadow:0 0 30px hotpink;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

/* การ์ด */

#content{
display:none;
width:100%;
}

.card{
width:90%;
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,.25);
animation:show 1s;
}

@keyframes show{
from{
opacity:0;
transform:scale(.7);
}
to{
opacity:1;
transform:scale(1);
}
}

.card h1{
color:#ff1493;
margin-bottom:15px;
font-size:38px;
}

#slide{
width:100%;
height:360px;
object-fit:cover;
border-radius:20px;
border:6px solid pink;
transition:1s;
}

.card p{
margin-top:20px;
font-size:20px;
line-height:1.8;
color:#555;
}

/* หัวใจ */

.heart{
position:fixed;
bottom:-40px;
pointer-events:none;
animation:float linear forwards;
}

@keyframes float{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(-110vh) rotate(360deg);
opacity:0;
}
}
</style>

</head>

<body>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div id="startScreen">
<button id="startBtn">🎁 เริ่มเซอร์ไพรส์ 🎁</button>
</div>

<div id="content">

<div class="card">

<h1>🎂 Happy Birthday 🎂</h1>

<img
id="slide"
src="751035036_1719591268958655_8370233642973154637_n.jpg">

<p>
สุขสันต์วันเกิดนะ ❤️<br><br>

ขอให้ปีนี้เป็นปีที่เต็มไปด้วยความสุข<br>
สุขภาพแข็งแรง<br>
ยิ้มเยอะ ๆ<br>
สมหวังในทุกเรื่องที่ตั้งใจ<br>
มีแต่คนรัก คนเอ็นดู<br><br>

ขอให้รอยยิ้มของเธอสดใสแบบนี้ตลอดไป 💕<br><br>

🎉 Happy Birthday 🎉
</p>

</div>

</div>

<script>

const music=document.getElementById("music");

const images=[

"751035036_1719591268958655_8370233642973154637_n.jpg",

"752550920_1018062320995628_3834456038027307601_n.jpg",

"754015096_2926203654416033_1176873942568398260_n.jpg",

"753105080_1500194058456130_231933915178450339_n.jpg",

"751134574_1477406654429882_498575148599167075_n.jpg"

];

let index=0;

document.getElementById("startBtn").onclick=()=>{

music.play();

document.getElementById("startScreen").style.display="none";

document.getElementById("content").style.display="block";

setInterval(()=>{

index++;

if(index>=images.length) index=0;

document.getElementById("slide").src=images[index];

},5000);

setInterval(createHeart,250);

}

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*35)+"px";

heart.style.animationDuration=(4+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},9000);

}

</script>

</body>
</html>

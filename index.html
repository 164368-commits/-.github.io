<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Happy Birthday 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#ffd1dc,#ffe4b5,#fffacd);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    width:400px;
    background:#fff;
    padding:20px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(255,105,180,.4);
}

#slide{
    width:100%;
    height:450px;
    object-fit:cover;
    border-radius:20px;
    border:4px solid hotpink;
    transition:opacity .8s;
}

h2{
    margin:15px 0;
    color:#ff1493;
    font-size:30px;
}

button{
    background:#ff1493;
    color:white;
    border:none;
    padding:12px 35px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#ff69b4;
    transform:scale(1.05);
}

#text{
    display:none;
    margin-top:20px;
    color:#d81b60;
    font-size:20px;
    line-height:1.8;
}

.float{
    position:fixed;
    font-size:30px;
    animation:float 6s linear infinite;
    pointer-events:none;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-120px);
        opacity:0;
    }
}
</style>

</head>
<body>

<div class="card">

<img id="slide" src="751035036_1719591268958655_8370233642973154637_n.jpg">

<h2>🎂 Happy Birthday 🎂</h2>

<button onclick="startBirthday()">
🎁 เปิดคำอวยพร 🎁
</button>

<div id="text">
🎉 สุขสันต์วันเกิดนะ 🎉<br><br>

ขอให้มีความสุขมาก ๆ<br>
สุขภาพแข็งแรง สมหวังในทุกเรื่อง 💖<br>
ขอให้รอยยิ้มอยู่กับเธอทุกวัน 😊<br>
คิดสิ่งใดก็ขอให้สมปรารถนา<br><br>

🎂 Happy Birthday 🎂
</div>

<audio id="music">
    <source src="เพลงรัก Three Man Down Official MV.mp3" type="audio/mpeg">
</audio>

</div>

<script>

// รูปภาพ
const images=[
"751035036_1719591268958655_8370233642973154637_n.jpg",
"752550920_1018062320995628_3834456038027307601_n.jpg",
"754015096_2926203654416033_1176873942568398260_n.jpg",
"753105080_1500194058456130_231933915178450339_n.jpg",
"751134574_1477406654429882_498575148599167075_n.jpg"
];

let index=0;

// สไลด์รูป
setInterval(()=>{
    const img=document.getElementById("slide");
    img.style.opacity=0;

    setTimeout(()=>{
        index=(index+1)%images.length;
        img.src=images[index];
        img.style.opacity=1;
    },400);

},3000);

// เล่นเพลง
function startBirthday(){

    document.getElementById("music").play();

    document.getElementById("text").style.display="block";

}

// เอฟเฟกต์ลอย
const icons=["🎈","🎂","🎁","🎉","✨","💖"];

function createFloat(){

    const item=document.createElement("div");

    item.className="float";

    item.innerHTML=icons[Math.floor(Math.random()*icons.length)];

    item.style.left=Math.random()*100+"vw";

    item.style.fontSize=(25+Math.random()*20)+"px";

    document.body.appendChild(item);

    setTimeout(()=>{
        item.remove();
    },6000);

}

setInterval(createFloat,300);

</script>

</body>
</html>
